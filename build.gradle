plugins {
    id 'com.android.application' version '8.12.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0' apply false
}

def appVersion = new Properties()
file('version.properties').withInputStream { appVersion.load(it) }
ext.appVersionCode = appVersion.getProperty('versionCode').toInteger()
ext.appVersionName = appVersion.getProperty('versionName')
